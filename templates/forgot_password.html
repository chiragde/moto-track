{% extends "base.html" %}
{% from "macros.html" import flash_messages %}

{% block title %}Forgot Password - Moto Track{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p>Enter your username to receive a reset link</p>
    {{ flash_messages() }}
    <form method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>
      </div>
      <button class="btn btn-primary" type="submit">Send Reset Link</button>
    </form>
    <a class="inline-link" href="{{ url_for('login') }}">Back to sign in</a>
  </div>
</div>
{% endblock %}
